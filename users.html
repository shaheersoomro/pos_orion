    <style>
        .admin-wrapper {
            display: flex;
            height: 100vh;
        }

        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .admin-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
        }

        .user-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: var(--spacing-lg);
        }

        .user-card .user-name {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .user-card .user-role {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--secondary);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            display: inline-block;
            margin-bottom: var(--spacing-lg);
        }

        .user-status {
            font-size: 12px;
            color: var(--success);
            margin-bottom: var(--spacing-lg);
        }

        .user-actions {
            display: flex;
            gap: var(--spacing-md);
            width: 100%;
        }

        .btn-icon {
            flex: 1;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            background: var(--bg-white);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .btn-icon:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-user-form">
                        <div class="mb-3 form-group">
                            <label class="form-label">User Name</label>
                            <input type="text" class="form-control" id="user-name" placeholder="Enter User Name" required>
                        </div>
                    
                        <div class="mb-3 form-group">
                            <label class="form-label">Role</label>
                            <select class="form-control" id="user-role">
                                <option value="Admin">Admin</option>
                                <option value="Manager">Manager</option>
                                <option value="Cashier">Cashier</option>
                            </select>
                        </div>
                        <div class="mb-3 form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="user-email" placeholder="Enter Email Address">
                        </div>
                        <div class="mb-3 form-group">
                            <label class="form-label">Password</label>
                            <div class="password-container">
                                <input type="password" class="form-control" id="user-password" placeholder="••••••••">
                                <button type="button" class="toggle-password" id="togglePassword"
                                    aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div id="user-validation" class="alert alert-warning" style="display: none;"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-action btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-action btn-primary" id="btn-save-user">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade success-modal" id="addUserSuccessModal" tabindex="-1">

                </div>

                    <div class="successfull-badge">
                        <i class="bi bi-check"></i>
                    </div>
                    <div class="Successfull-info">
                        <h1>User Added Successfull!</h1>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-action btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
