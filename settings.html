<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Orion POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style_new.css">
    <style>
        .admin-wrapper {
            display: flex;
            height: 100vh;
        }
        
        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .admin-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: var(--spacing-lg);
        }
        
        .settings-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        
        .settings-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .settings-header i {
            font-size: 20px;
            color: var(--primary);
        }
        
        .settings-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .settings-body {
            padding: var(--spacing-lg);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-group:last-child {
            margin-bottom: 0;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 75, 158, 0.1);
            color: var(--text-primary);
        }
        
        .form-check {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }
        
        .form-check input {
            width: auto;
            cursor: pointer;
        }
        
        .form-check label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }
        
        .btn-save {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-save:hover {
            background: var(--primary-dark);
        }
        
        .permissions-table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }
        
        .permissions-table th,
        .permissions-table td {
            padding: var(--spacing-md);
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        
        .permissions-table th {
            background: var(--secondary);
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .permissions-table input {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="bi bi-lightning-fill"></i>
                    <span>Orion</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="bi bi-shop"></i>
                    <span>POS</span>
                </a>
                <a href="dashboard.html" class="nav-item">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a href="inventory.html" class="nav-item">
                    <i class="bi bi-box-seam"></i>
                    <span>Inventory</span>
                </a>
                <a href="history.html" class="nav-item">
                    <i class="bi bi-clock-history"></i>
                    <span>History</span>
                </a>
                <a href="users.html" class="nav-item">
                    <i class="bi bi-people"></i>
                    <span>Users</span>
                </a>
                <a href="#" class="nav-item active">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">A</div>
                    <div class="user-info">
                        <div class="user-name">Alice</div>
                        <div class="user-role">Admin</div>
                    </div>
                </div>
                <a href="login.html" class="logout-btn">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </aside>
        
        <!-- Main Content -->
        <div class="admin-main">
            <header class="top-header">
                <div class="header-left">
                    <h1 class="page-title">Settings</h1>
                </div>
            </header>
            
            <div class="admin-content">
                <div class="settings-grid">
                    <!-- Business Information -->
                    <div class="settings-card">
                        <div class="settings-header">
                            <i class="bi bi-shop"></i>
                            <h3>Business Information</h3>
                        </div>
                        <div class="settings-body">
                            <div class="form-group">
                                <label>Business Name</label>
                                <input type="text" value="Orion Cafe & Salon">
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <input type="text" value="123 Main St, Anytown, USA">
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="tel" value="(555) 123-4567">
                            </div>
                            <button class="btn-save">Save Changes</button>
                        </div>
                    </div>
                    
                    <!-- Tax Settings -->
                    <div class="settings-card">
                        <div class="settings-header">
                            <i class="bi bi-percent"></i>
                            <h3>Tax Settings</h3>
                        </div>
                        <div class="settings-body">
                            <div class="form-group">
                                <label>Sales Tax Rate (%)</label>
                                <input type="number" value="8.00" step="0.01">
                            </div>
                            <div class="form-group">
                                <label>Tax Name</label>
                                <input type="text" value="Sales Tax">
                            </div>
                            <div class="form-check">
                                <input type="checkbox" id="tax-inclusive" checked>
                                <label for="tax-inclusive">Prices are tax-inclusive</label>
                            </div>
                            <button class="btn-save">Save Changes</button>
                        </div>
                    </div>
                </div>
                
                <!-- Permissions -->
                <div class="settings-card" style="margin-top: var(--spacing-lg);">
                    <div class="settings-header">
                        <i class="bi bi-shield-lock"></i>
                        <h3>User Permissions</h3>
                    </div>
                    <div class="settings-body">
                        <table class="permissions-table">
                            <thead>
                                <tr>
                                    <th>Feature</th>
                                    <th style="text-align: center;">Admin</th>
                                    <th style="text-align: center;">Manager</th>
                                    <th style="text-align: center;">Cashier</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Access Dashboard</td>
                                    <td style="text-align: center;"><input type="checkbox" checked></td>
                                    <td style="text-align: center;"><input type="checkbox" checked></td>
                                    <td style="text-align: center;"><input type="checkbox"></td>
                                </tr>
                                <tr>
                                    <td>Manage Inventory</td>
                                    <td style="text-align: center;"><input type="checkbox" checked></td>
                                    <td style="text-align: center;"><input type="checkbox" checked></td>
                                    <td style="text-align: center;"><input type="checkbox"></td>
                                </tr>
                                <tr>
                                    <td>Process Refunds</td>
                                    <td style="text-align: center;"><input type="checkbox" checked></td>
                                    <td style="text-align: center;"><input type="checkbox" checked></td>
                                    <td style="text-align: center;"><input type="checkbox"></td>
                                </tr>
                            </tbody>
                        </table>
                        <button class="btn-save" style="margin-top: var(--spacing-lg);">Save Permissions</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
