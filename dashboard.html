<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Orion POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style_new.css">
    <style>
        .admin-wrapper {
            display: flex;
            height: 100vh;
            background: var(--bg-light);
        }

        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .admin-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .metric-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--primary);
        }

        .metric-card.success {
            border-left-color: var(--success);
        }

        .metric-card.warning {
            border-left-color: var(--warning);
        }

        .metric-card.info {
            border-left-color: var(--info);
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--spacing-md);
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
        }

        .metric-change {
            font-size: 12px;
            color: var(--success);
            font-weight: 600;
        }

        .metric-change.negative {
            color: var(--danger);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-lg);
        }

        .chart-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-md);
        }

        .chart-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
        }

        .chart-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--secondary);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
        }

        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">

        <!-- Main Content -->
        <div class="admin-main">
            <header class="top-header">
                <div class="header-left">
                    <h1 class="page-title">Dashboard</h1>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="avatar"></div>
                        <div class="user-info">
                            <div class="user-name"></div>
                            <div class="user-role"></div>
                        </div>
                        <a href="login.html" class="logout-btn" title="Logout">
                            <i class="bi bi-box-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <!-- Key Metrics -->
                <div class="metrics-grid">
                    <div class="metric-card success">
                        <div class="metric-label">Today's Sales</div>
                        <div class="metric-value">$1,250.50</div>
                        <div class="metric-change">↑ 12% from yesterday</div>
                    </div>
                    <div class="metric-card info">
                        <div class="metric-label">Total Transactions</div>
                        <div class="metric-value">55</div>
                        <div class="metric-change">↑ 8 more than yesterday</div>
                    </div>
                    <div class="metric-card warning">
                        <div class="metric-label">Average Order Value</div>
                        <div class="metric-value">$22.74</div>
                        <div class="metric-change negative">↓ 3% from yesterday</div>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts-grid">
                    <div class="chart-card">
                        <div class="chart-title">Sales Over Time (Last 7 Days)</div>
                        <div class="chart-container">
                            <canvas id="salesChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-title">Top 5 Selling Items</div>
                        <div class="chart-container">
                            <canvas id="topItemsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <nav class="bottom-navbar">
                <a href="index.html" class="nav-item" data-page="pos">
                    <i class="bi bi-shop"></i>
                    <span>POS</span>
                </a>
                <a href="dashboard.html" class="nav-item active" data-page="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>

                <a href="inventory.html" class="nav-item" data-page="inventory">
                    <i class="bi bi-box-seam"></i>
                    <span>Inventory</span>

                <a href="history.html" class="nav-item" data-page="history">

                <a href="users.html" class="nav-item" data-page="users">
                    <i class="bi bi-people"></i>
                    <span>Users</span>
                </a>
                <a href="settings.html" class="nav-item" data-page="settings">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="script_new.js"></script>
    <script>
        // Initialize charts
        document.addEventListener('DOMContentLoaded', () => {
            if (document.getElementById('salesChart')) {
                new Chart(document.getElementById('salesChart'), {
                    type: 'line',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{
                            label: 'Daily Sales ($)',
                            data: [450, 620, 580, 750, 910, 1250, 880],
                            borderColor: '#5B4B9E',
                            backgroundColor: 'rgba(91, 75, 158, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }

            if (document.getElementById('topItemsChart')) {
                new Chart(document.getElementById('topItemsChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Latte', 'Haircut', 'Espresso', 'Sandwich', 'Shampoo'],
                        datasets: [{
                            label: 'Units Sold',
                            data: [150, 95, 80, 65, 40],
                            backgroundColor: ['#5B4B9E', '#FF6B35', '#2ECC71', '#3498DB', '#E74C3C']
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { beginAtZero: true } }
                    }
                });
            }
        });
    </script>
