    <style>
        .admin-wrapper {
            display: flex;
            height: 100vh;
        }

        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .admin-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            transition: var(--transition);
        }

        .btn-add:hover {
            background: var(--primary-dark);
        }

        .table-container {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* Override Bootstrap table styles */
        .table {
            margin: 0 !important;
            font-size: 13px !important;
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }

        .table>:not(caption)>*>* {
            background-color: transparent !important;
            box-shadow: none !important;
            border-bottom: 1px solid var(--border-color) !important;
            color: var(--text-primary);
        }

        .table thead {
            background: var(--secondary) !important;
            border-bottom: 1px solid var(--border-color) !important;
        }

        .table th {
            font-weight: 600;
            color: var(--text-primary) !important;
            padding: var(--spacing-lg);
            border: none;
        }

        .table td {
            padding: var(--spacing-lg);
            border-color: var(--border-color) !important;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: var(--secondary) !important;
        }

        .badge {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: 11px;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(255, 107, 53, 0.1);
            color: var(--warning);
        }

        .action-buttons {
            display: flex;
            gap: var(--spacing-md);
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--secondary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .btn-icon:hover {
            background: var(--secondary-dark);
            color: var(--primary);
        }
    </style>
</head>

        <!-- Main Content -->
        <div class="admin-main">
            <header class="top-header">
                <div class="header-left">
                    <h1 class="page-title">Inventory Management</h1>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="avatar">A</div>
                        <div class="user-info">
                            <div class="user-name">Alice</div>
                            <div class="user-role">Cashier</div>
                        </div>
                        <a href="login.html" class="logout-btn" title="Logout">
                            <i class="bi bi-box-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <div class="content-header">
                    <div></div>
                    <button class="btn-add" id="btn-add-product">
                        <i class="bi bi-plus-circle"></i> Add Product
                    </button>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Espresso</td>
                                <td>Coffee</td>
                                <td>$3.50</td>
                                <td>120</td>
                                <td><span class="badge badge-success">In Stock</span></td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-icon" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button class="btn-icon" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>Latte</td>
                                <td>Coffee</td>
                                <td>$4.50</td>
                                <td>85</td>
                                <td><span class="badge badge-success">In Stock</span></td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-icon" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button class="btn-icon" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>Sandwich</td>
                                <td>Food</td>
                                <td>$7.99</td>
                                <td>15</td>
                                <td><span class="badge badge-warning">Low Stock</span></td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-icon" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button class="btn-icon" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <nav class="bottom-navbar">
                <a href="index.html" class="nav-item" data-page="pos">

            </nav>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-product-form">
                        <div class="mb-3 form-group">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="product-name" placeholder="Product Name" required>
                        </div>
                        <div class="mb-3 form-group">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" id="product-price" step="0.01" min="0" placeholder="0.0" required>
                        </div>
                        <div class="mb-3 form-group">
                            <label class="form-label">Category</label>
                            <select class="form-control" id="product-category">
                                <option value="coffee">Coffee</option>
                                <option value="food">Food</option>
                                <option value="services">Services</option>
                            </select>
                        </div>
                        <div class="mb-3 form-group">
                            <label class="form-label">Icon URL (optional)</label>
                            <input type="text" class="form-control" id="product-icon" placeholder="images/product.png">
                        </div>
                        <div id="product-validation" class="alert alert-warning" style="display: none;"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-action btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-action btn-primary" id="btn-save-product">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade success-modal" id="addProductSuccessModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <!-- <h5 class="modal-title">Success</h5> -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="successfull-badge">
                        <i class="bi bi-check"></i>
                    </div>
                    <div class="Successfull-info">
                        <h1>Product Added Successfull!</h1>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-action btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
