<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orion POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style_new.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
        }




        .overlay {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.60);
        }

        .left-side {
            position: relative;
            background: url('images/login-bg.jpg') no-repeat center center/cover;
            height: 100vh;
        }

        .login-card {
            padding: 20px 40px;
            /* Reduced top/bottom padding */
            justify-content: flex-start;
            /* Align content to the top */
            overflow-y: auto;
            /* Allow scrolling for long forms */

            background-color: var(--bg-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;

        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .logo-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 75, 158, 0.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .remember-forgot a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-check input {
            width: auto;
            cursor: pointer;
        }

        .form-check label {
            margin: 0;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(91, 75, 158, 0.3);
        }

        .login-footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            background: var(--secondary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 20px;
            border-left: 3px solid var(--primary);
        }

        .demo-credentials strong {
            color: var(--text-primary);
        }

        .hero-container {
            position: absolute;
            top: 80%;
            color: var(--text-primary);
            text-align: left;
            padding: 20px;
            width: 70%;
        }

        .hero-container h1 {
            font-family: "Oswald", sans-serif;
            line-height: 0px;
            font-size: 128px;
            color: var(--primary);
            font-weight: 700;

        }

        .hero-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.2;
        }
    </style>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-lg-8 left-side p-0">
                <div class="container-fluid overlay">
                    <div class="hero-container">
                        <h1>“</h1>
                        <h2 class="hero-title">Turn your checkout into a growth engine. Get the tools to sell smarter
                            and manage effortlessly."</h2>

                    </div>
                </div>
            </div>
            <div class="col-lg-4 p-0">
                <div class="login-card">
                    <div class="login-header">
                        <div class="logo-icon"><i class="bi bi-lightning-fill"></i></div>
                        <div class="logo-text">Orion POS</div>
                        <div class="logo-subtitle">Modern Point of Sale System</div>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="your.email@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-container">
                                <input type="password" class="password" id="password" placeholder="••••••••" required>
                                <button type="button" class="toggle-password" id="togglePassword"
                                    aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="remember-forgot">
                            <div class="form-check">
                                <input type="checkbox" id="remember" checked>
                                <label for="remember">Remember me</label>
                            </div>
                            <a href="#">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-login" id="login-btn">
                            Sign In
                        </button>
                    </form>

                    <div class="login-footer">
                        Don't have an account? <a href="signup.html">Create one</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Login-specific JavaScript
        document.addEventListener("DOMContentLoaded", function () {
            const loginBtn = document.getElementById("login-btn");
            const loginForm = document.getElementById('loginForm');

            // Common validation functions (copied from shared code)
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function showError(fieldId, message) {
                clearErrorForField(fieldId);

                const field = document.getElementById(fieldId);
                if (!field) return;

                const formGroup = field.closest(".form-group") || field.closest(".form-check");
                if (!formGroup) return;

                const errorElement = document.createElement("div");
                errorElement.className = "error-message";
                errorElement.setAttribute("data-field", fieldId);
                errorElement.innerHTML = message;
                errorElement.style.color = "#BE3E3F";
                errorElement.style.fontSize = "0.875rem";
                errorElement.style.marginTop = "0.25rem";
                errorElement.style.fontWeight = "400";

                formGroup.appendChild(errorElement);
                field.style.borderColor = "#BE3E3F";
            }

            function showSuccess(message) {
                const existingSuccess = document.querySelector(".success-message");
                if (existingSuccess) existingSuccess.remove();

                const successElement = document.createElement("div");
                successElement.className = "success-message";
                successElement.textContent = message;
                successElement.style.color = "#02CA3A";
                successElement.style.backgroundColor = "#d4edda";
                successElement.style.border = "1px solid #c3e6cb";
                successElement.style.borderRadius = "0.25rem";
                successElement.style.padding = "0.75rem";
                successElement.style.margin = "1rem 0";
                successElement.style.fontSize = "0.875rem";

                const form = document.querySelector("form");
                if (form) form.parentNode.insertBefore(successElement, form.nextSibling);
            }

            function clearErrors() {
                document.querySelectorAll(".error-message").forEach(error => error.remove());
                document.querySelectorAll(".success-message").forEach(msg => msg.remove());

                // Reset border colors for all form fields
                const formFields = document.querySelectorAll(".form-group input, .form-group select");
                formFields.forEach(field => {
                    field.style.borderColor = "";
                });
            }

            function clearErrorForField(fieldId) {
                const field = document.getElementById(fieldId);
                if (!field) return;

                const formGroup = field.closest(".form-group") || field.closest(".form-check");
                if (!formGroup) return;

                const errorMessage = formGroup.querySelector(`.error-message[data-field="${fieldId}"]`) ||
                    formGroup.querySelector(".error-message");
                if (errorMessage) errorMessage.remove();

                field.style.borderColor = "";
            }

            function initPasswordToggle() {
                document.querySelectorAll(".toggle-password").forEach(button => {
                    button.addEventListener("click", function () {
                        const passwordInput = this.parentElement.querySelector("input");
                        const icon = this.querySelector("i");

                        if (passwordInput.type === "password") {
                            passwordInput.type = "text";
                            icon.classList.replace("bi-eye", "bi-eye-slash");
                            this.setAttribute("aria-label", "Hide password");
                        } else {
                            passwordInput.type = "password";
                            icon.classList.replace("bi-eye-slash", "bi-eye");
                            this.setAttribute("aria-label", "Show password");
                        }
                    });
                });
            }

            async function makeRequest(url, method, data) {
                try {
                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data)
                    });

                    return await response.json();
                } catch (error) {
                    console.error('Request failed:', error);
                    return {
                        success: false,
                        message: 'Network error. Please check if the server is running.'
                    };
                }
            }

            function initDemoCredentials() {
                const demoCredentials = document.getElementById('demoCredentials');
                if (demoCredentials) {
                    demoCredentials.addEventListener('click', function (e) {
                        e.preventDefault();

                        const emailField = document.getElementById('email');
                        const passwordField = document.getElementById('password');
                        const rememberCheckbox = document.getElementById('remember');

                        if (emailField && passwordField) {
                            emailField.value = 'admin@orionpos.com';
                            passwordField.value = 'Admin@123';
                            if (rememberCheckbox) rememberCheckbox.checked = true;

                            // Clear any errors
                            clearErrorForField('email');
                            clearErrorForField('password');

                            // Show success message
                            const existingMsg = document.querySelector('.demo-fill-message');
                            if (existingMsg) existingMsg.remove();

                            const message = document.createElement('div');
                            message.className = 'success-message demo-fill-message';
                            message.textContent = 'Demo credentials filled. Click Sign In to login.';
                            message.style.marginTop = '10px';

                            demoCredentials.parentNode.insertBefore(message, demoCredentials.nextSibling);
                        }
                    });
                }
            }

            // Initialize login functionality
            if (loginBtn && loginForm) {
                // Real-time validation for login fields
                const loginEmail = document.getElementById("email");
                const loginPassword = document.getElementById("password");

                if (loginEmail) {
                    loginEmail.addEventListener("blur", function () {
                        clearErrorForField("email");
                        const email = this.value.trim();
                        if (!email) {
                            showError("email", "Email is required.");
                        } else if (!isValidEmail(email)) {
                            showError("email", "Please enter a valid email address.");
                        }
                    });
                    loginEmail.addEventListener("input", () => clearErrorForField("email"));
                }

                if (loginPassword) {
                    loginPassword.addEventListener("blur", function () {
                        clearErrorForField("password");
                        if (!this.value) {
                            showError("password", "Password is required.");
                        }
                    });
                    loginPassword.addEventListener("input", () => clearErrorForField("password"));
                }

                // Handle form submission
                loginForm.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const email = document.getElementById("email").value.trim();
                    const password = document.getElementById("password").value;
                    const rememberMe = document.getElementById("remember")?.checked;

                    // Clear previous errors
                    clearErrors();

                    let isValid = true;

                    // Validate email
                    if (!email) {
                        showError("email", "Email is required.");
                        isValid = false;
                    } else if (!isValidEmail(email)) {
                        showError("email", "Please enter a valid email address.");
                        isValid = false;
                    }

                    // Validate password
                    if (!password) {
                        showError("password", "Password is required.");
                        isValid = false;
                    }

                    if (isValid) {
                        // Disable button and show loading state
                        loginBtn.disabled = true;
                        loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing In...';

                        try {
                            // Prepare data for API
                            const loginData = {
                                email: email,
                                password: password
                            };

                            console.log('Sending login request with data:', loginData);
                            // Send login request to backend
                            const result = await makeRequest('http://localhost:3001/api/auth/login', 'POST', loginData);

                            if (result.success) {
                                showSuccess("Login successful! Redirecting to POS...");

                                // Save token and user data to localStorage
                                localStorage.setItem('token', result.token);
                                localStorage.setItem('user', JSON.stringify(result.user));

                                // Save remember me preference
                                if (rememberMe) {
                                    localStorage.setItem('rememberEmail', email);
                                } else {
                                    localStorage.removeItem('rememberEmail');
                                }

                                // Redirect after delay
                                setTimeout(() => {
                                    window.location.href = "index.html";
                                }, 1500);
                            } else {
                                // Handle login errors
                                if (result.errors && result.errors.length > 0) {
                                    result.errors.forEach(error => {
                                        showError(error.field, error.message);
                                    });
                                } else {
                                    showError('general', result.message || 'Login failed. Please check your credentials.');
                                }
                            }
                        } catch (error) {
                            console.error('Login error:', error);
                            showError('general', 'An error occurred during login. Please try again.');
                        } finally {
                            // Re-enable button
                            loginBtn.disabled = false;
                            loginBtn.textContent = 'Sign In';
                        }
                    }
                });
            }

            // Initialize on page load
            initPasswordToggle();
            initDemoCredentials();

            // Check if there's a remembered email
            const rememberedEmail = localStorage.getItem('rememberEmail');
            if (rememberedEmail) {
                const emailField = document.getElementById('email');
                const rememberCheckbox = document.getElementById('remember');

                if (emailField) {
                    emailField.value = rememberedEmail;
                }
                if (rememberCheckbox) {
                    rememberCheckbox.checked = true;
                }
            }

            // Clear errors when user starts typing in any field
            document.querySelectorAll("input, select").forEach(field => {
                field.addEventListener("input", function () {
                    const fieldId = this.id;
                    if (fieldId) {
                        clearErrorForField(fieldId);
                    }
                });
            });

            // Handle forgot password link
            const forgotPasswordLink = document.getElementById('forgot-password');
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    showSuccess('Password reset link has been sent to your email.');
                });
            }
        });
    </script>
</body>

</html>
