<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Orion POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style_new.css">
    <style>
        .admin-wrapper {
            display: flex;
            height: 100vh;
        }

        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .admin-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
        }

        .filter-bar {
            background: var(--bg-white);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            display: flex;
            gap: var(--spacing-lg);
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select,
        .filter-btn {
            background-color: var(--bg-light);
            color: var(--text-secondary);
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 13px !important;
            height: 52px !important;
        }

        .table-container {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* Override Bootstrap table styles */
        .table {
            margin: 0 !important;
            font-size: 13px !important;
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }

        .table>:not(caption)>*>* {
            background-color: transparent !important;
            box-shadow: none !important;
            border-bottom: 1px solid var(--border-color) !important;
            color: var(--text-primary);
        }

        .table thead {
            background: var(--secondary);
        }

        .table th {
            font-weight: 600;
            color: var(--text-primary);
            padding: var(--spacing-lg);
            border: none;
        }

        .table td {
            padding: var(--spacing-md);
            border-color: var(--border-color);
        }

        .table tbody tr:hover {
            background: var(--secondary);
            cursor: pointer;
        }

        .badge {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: 11px;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success);
        }

        /* Add these styles to your existing CSS */
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-completed {
            background: rgba(46, 204, 113, 0.15);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .status-pending {
            background: rgba(241, 196, 15, 0.15);
            color: #f39c12;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }

        .status-cancelled {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .status-refunded {
            background: rgba(155, 89, 182, 0.15);
            color: #9b59b6;
            border: 1px solid rgba(155, 89, 182, 0.3);
        }

        .action-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 6px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            background: var(--secondary);
            color: var(--primary);
            border-color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--border-color);
        }

        .pagination-container {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .pagination .page-link {
            color: var(--primary);
            border: 1px solid var(--border-color);
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .pagination .page-item.disabled .page-link {
            color: var(--text-secondary);
        }

        .items-count {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--bg-light);
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        /* Discount styles */
        .discount-badge {
            background: rgba(91, 75, 158, 0.1);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        .discount-item {
            background: rgba(46, 204, 113, 0.1);
            border-radius: var(--radius-sm);
            padding: var(--spacing-sm);
            margin-bottom: var(--spacing-xs);
        }

        .discount-amount {
            color: var(--success);
            font-weight: 600;
        }

        .sort-active {
            background: var(--primary) !important;
            color: white !important;
            border-color: var(--primary) !important;
        }

        .sort-active i {
            color: white;
        }

        /* Search input styling */
        #search-transaction {
            background-color: var(--bg-light);
            color: var(--text-primary);
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s ease;
            width: 100%;
        }

        #search-transaction:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 75, 158, 0.1);
        }

        /* Filter actions layout */
        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <!-- Main Content -->
        <div class="admin-main">
            <header class="top-header">
                <div class="header-left">
                    <h1 class="page-title">Transaction History</h1>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="avatar"></div>
                        <div class="user-info">
                            <div class="user-name"></div>
                            <div class="user-role"></div>
                        </div>
                        <a href="login.html" class="logout-btn" title="Logout">
                            <i class="bi bi-box-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <div class="filter-bar">
                    <div class="filter-group">
                        <label>Date From</label>
                        <input type="date" id="date-from">
                    </div>
                    <div class="filter-group">
                        <label>Date To</label>
                        <input type="date" id="date-to">
                    </div>
                    <div class="filter-group">
                        <label>Payment Method</label>
                        <select id="payment-method">
                            <option value="">All</option>
                            <option value="cash">Cash</option>
                            <option value="card">Card</option>
                            <option value="wallet">Wallet</option>
                            <option value="credit">Credit</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Status</label>
                        <select id="status-filter">
                            <option value="">All</option>
                            <option value="completed">Completed</option>
                            <option value="refunded">Refunded</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="pending">Pending</option>
                            <option value="partially_refunded">Partially Refunded</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Search by Transaction ID</label>
                        <input type="text" id="search-transaction" placeholder="Enter transaction ID...">
                    </div>
                    <div class="filter-group">
                        <label>Sort by Date</label>
                        <button class="filter-btn" id="sort-date-btn">
                            <i class="bi bi-arrow-down"></i> Newest First
                        </button>
                    </div>
                    <div class="filter-group">
                        <label>&nbsp;</label>
                        <button class="filter-btn" id="apply-filters">
                            <i class="bi bi-funnel"></i>
                        </button>
                    </div>
                    <div class="filter-group">
                        <label>&nbsp;</label>
                        <button class="btn-action btn-success filter-btn" id="export-btn">
                            <i class="bi bi-download"></i>
                        </button>
                    </div>
                </div>

                <!-- Transaction Table -->
                <div class="table-container">
                    <table class="table" id="transactions-table">
                        <thead>
                            <tr>
                                <th>Transaction ID</th>
                                <th>Date/Time</th>
                                <th>Items</th>
                                <th>Customer</th>
                                <th>Subtotal</th>
                                <th>Discount</th>
                                <th>Tax</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Cashier</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-body">
                            <!-- Transactions will be loaded here -->
                            <tr id="loading-row">
                                <td colspan="12" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2">Loading transactions...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Pagination -->
                    <div class="pagination-container" id="pagination-container" style="display: none;">
                        <nav aria-label="Transaction pagination">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- Pagination buttons will be added here -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
            <nav class="bottom-navbar">
                <a href="index.html" class="nav-item" data-page="pos">
                    <i class="bi bi-shop"></i>
                    <span>POS</span>
                </a>
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
                <a href="inventory.html" class="nav-item" data-page="inventory">
                    <i class="bi bi-box-seam"></i>
                    <span>Inventory</span>
                </a>
                <a href="history.html" class="nav-item active" data-page="history">
                    <i class="bi bi-clock-history"></i>
                    <span>History</span>
                </a>
                <a href="users.html" class="nav-item" data-page="users">
                    <i class="bi bi-people"></i>
                    <span>Users</span>
                </a>
                <a href="settings.html" class="nav-item" data-page="settings">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!--Print Receipt Modal-->
    <div class="modal fade" id="printReceiptModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Print Receipt</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center mb-3">
                        <i class="bi bi-printer" style="font-size: 48px; color: var(--primary);"></i>
                    </div>
                    <div class="form-group mb-3">
                        <label>Printer Type</label>
                        <select id="printer-type" class="form-select">
                            <option value="thermal">Thermal Printer (80mm)</option>
                            <option value="standard">Standard Printer</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label>Copies</label>
                        <input type="number" id="print-copies" class="form-control" value="1" min="1" max="5">
                    </div>
                    <div class="alert alert-info">
                        <small><i class="bi bi-info-circle"></i> Make sure your thermal printer is connected and set as
                            default</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-action btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-action btn-primary" id="confirm-print-btn">Print Receipt</button>
                </div>
            </div>
        </div>
    </div>

    <div id="receipt-template" style="display: none;">
        <div class="receipt" style="width: 80mm; font-family: 'Courier New', monospace; font-size: 12px; padding: 8px;">
            <!-- Content will be filled dynamically -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="receipt-printer.js"></script>

    <script>
        const API_BASE_URL = 'http://localhost:3001/api';

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        // Format date to readable string
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Format time to readable string
        function formatTime(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Format date and time together
        function formatDateTime(dateString) {
            if (!dateString) return 'N/A';
            return `${formatDate(dateString)} ${formatTime(dateString)}`;
        }

        // Get top items for display
        function getTopItems(items) {
            if (!items || items.length === 0) return 'No items';

            const topItems = items.slice(0, 2).map(item => item.name);
            return topItems.join(', ') + (items.length > 2 ? ` +${items.length - 2} more` : '');
        }

        // Get payment method display text
        function getPaymentMethodDisplay(method) {
            if (!method) return 'N/A';
            return method.charAt(0).toUpperCase() + method.slice(1);
        }

        // Get status badge class
        function getStatusClass(status) {
            if (!status) return 'status-completed';
            switch (status.toLowerCase()) {
                case 'completed': return 'status-completed';
                case 'pending': return 'status-pending';
                case 'cancelled': return 'status-cancelled';
                case 'refunded': return 'status-refunded';
                case 'partial_refund': return 'status-refunded';
                default: return 'status-completed';
            }
        }

        // Get status display text
        function getStatusDisplay(status) {
            if (!status) return 'Completed';
            return status.charAt(0).toUpperCase() + status.slice(1).replace('_', ' ');
        }

        // ============================================
        // TOAST NOTIFICATION
        // ============================================

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container') || createToastContainer();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icon = type === 'success' ? 'bi-check-circle-fill' :
                type === 'error' ? 'bi-exclamation-circle-fill' :
                    type === 'warning' ? 'bi-exclamation-triangle-fill' :
                        'bi-info-circle-fill';

            toast.innerHTML = `
                <i class="bi ${icon} toast-icon"></i>
                <div class="toast-content">
                    <div class="toast-title">${type.charAt(0).toUpperCase() + type.slice(1)}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }, 5000);

            toast.addEventListener('click', () => {
                toast.classList.add('fade-out');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            });
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toast-container';
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // ============================================
        // AUTHENTICATION & USER MANAGEMENT
        // ============================================

        function checkAuthentication() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user'));

            if (!token || !user) {
                showToast('Please login first', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                return false;
            }

            updateUserInfo(user);
            return true;
        }

        function updateUserInfo(user) {
            const userNameEl = document.querySelector('.user-name');
            const userRoleEl = document.querySelector('.user-role');
            const avatarEl = document.querySelector('.avatar');

            if (userNameEl) userNameEl.textContent = user.fullName || 'User';
            if (userRoleEl) {
                userRoleEl.textContent = user.role === 'admin' ? 'Administrator' :
                    user.role === 'cashier' ? 'Cashier' :
                        user.role === 'manager' ? 'Manager' : 'User';
            }
            if (avatarEl && user.fullName) {
                avatarEl.textContent = user.fullName.charAt(0).toUpperCase();
            }
        }

        function setupLogout() {
            document.querySelectorAll('.logout-btn').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                });
            });
        }

        // ============================================
        // API HELPER FUNCTIONS
        // ============================================

        async function apiRequest(endpoint, options = {}) {
            const token = localStorage.getItem('token');

            if (!token) {
                window.location.href = 'login.html';
                return null;
            }

            const url = `${API_BASE_URL}${endpoint}`;
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...options.headers
            };

            try {
                const response = await fetch(url, { ...options, headers });
                const data = await response.json();

                if (!response.ok) {
                    return {
                        success: false,
                        status: response.status,
                        message: data.message || data.error || `API request failed with status ${response.status}`,
                        errors: data.errors
                    };
                }

                return data;
            } catch (error) {
                console.error('API request error:', error);
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    showToast('Cannot connect to server. Please check your connection.', 'error');
                } else {
                    showToast('Network error. Please check your connection.', 'error');
                }

                return {
                    success: false,
                    status: 0,
                    message: 'Network error',
                    errors: []
                };
            }
        }

        // ============================================
        // TRANSACTION MANAGEMENT
        // ============================================

        let allTransactions = [];
        let currentPage = 1;
        let totalPages = 1;
        let currentSortOrder = 'desc';
        const itemsPerPage = 20;

        async function loadTransactions(page = 1) {
            try {
                showTransactionLoading();

                // Build query parameters
                const params = new URLSearchParams({
                    page: page,
                    limit: itemsPerPage,
                    sortBy: 'createdAt',
                    sortOrder: currentSortOrder  // 👈 ADD SORT PARAMETER
                });

                // Get filter values
                const dateFrom = document.getElementById('date-from')?.value;
                const dateTo = document.getElementById('date-to')?.value;
                const paymentMethod = document.getElementById('payment-method')?.value;
                const status = document.getElementById('status-filter')?.value;
                const searchTransaction = document.getElementById('search-transaction')?.value;

                // Apply filters
                if (dateFrom) params.append('startDate', dateFrom);
                if (dateTo) params.append('endDate', dateTo);
                if (paymentMethod && paymentMethod !== 'all' && paymentMethod !== '') {
                    params.append('paymentMethod', paymentMethod.toLowerCase());
                }
                if (status && status !== 'all' && status !== '') {
                    params.append('status', status);
                }
                if (searchTransaction && searchTransaction.trim() !== '') {
                    params.append('search', searchTransaction.trim()); // 👈 ADD SEARCH PARAMETER
                }

                console.log('Loading with params:', params.toString());

                const data = await apiRequest(`/transactions?${params.toString()}`);

                if (!data) {
                    showTransactionError('Failed to connect to server');
                    return;
                }

                if (data.success) {
                    allTransactions = data.transactions || [];
                    currentPage = data.pagination?.page || page;
                    totalPages = data.pagination?.pages || 1;

                    renderTransactions(allTransactions);
                    renderPagination();
                } else {
                    showTransactionError(data.message || 'Failed to load transactions');
                }

            } catch (error) {
                console.error('Error loading transactions:', error);
                showTransactionError('Error loading transactions');
            }
        }

        function showTransactionLoading() {
            const tbody = document.getElementById('transactions-body');
            if (tbody) {
                tbody.innerHTML = `
                    <tr id="loading-row">
                        <td colspan="12" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Loading transactions...</p>
                        </td>
                    </tr>
                `;
            }
        }

        function showTransactionError(message) {
            const tbody = document.getElementById('transactions-body');
            if (tbody) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="12" class="text-center py-5">
                            <div class="empty-state">
                                <i class="bi bi-exclamation-triangle"></i>
                                <h4>${message}</h4>
                                <p>Please try again later</p>
                                <button class="action-btn mt-3" onclick="loadTransactions()">
                                    <i class="bi bi-arrow-clockwise"></i> Retry
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }
            document.getElementById('pagination-container').style.display = 'none';
        }

        function renderTransactions(transactions) {
            const tbody = document.getElementById('transactions-body');
            if (!tbody) return;

            if (!transactions || transactions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="12" class="text-center py-5">
                            <div class="empty-state">
                                <i class="bi bi-receipt"></i>
                                <h4>No transactions found</h4>
                                <p>No transactions match your criteria</p>
                            </div>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination-container').style.display = 'none';
                return;
            }

            tbody.innerHTML = transactions.map(transaction => {
                // Calculate discount percentage if available
                const discountPercentage = transaction.discount > 0 && transaction.subtotal > 0
                    ? ((transaction.discount / transaction.subtotal) * 100).toFixed(0)
                    : null;

                return `
                    <tr data-transaction-id="${transaction._id}" style="cursor: pointer;">
                        <td>
                            <div class="fw-semibold">${transaction.transactionId || 'N/A'}</div>
                            ${transaction.discountsApplied?.length > 0 ?

        async function exportToCSV() {
            try {
                showToast('Preparing export...', 'info');

                // Build query parameters with current filters
                const params = new URLSearchParams({
                    format: 'csv'
                });

                const dateFrom = document.getElementById('date-from')?.value;
                const dateTo = document.getElementById('date-to')?.value;
                const paymentMethod = document.getElementById('payment-method')?.value;
                const status = document.getElementById('status-filter')?.value;
                const searchTransaction = document.getElementById('search-transaction')?.value;

                if (dateFrom) params.append('startDate', dateFrom);
                if (dateTo) params.append('endDate', dateTo);
                if (paymentMethod && paymentMethod !== 'all' && paymentMethod !== '') {
                    params.append('paymentMethod', paymentMethod.toLowerCase());
                }
                if (status && status !== 'all' && status !== '') {
                    params.append('status', status);
                }
                if (searchTransaction && searchTransaction.trim() !== '') {
                    params.append('search', searchTransaction.trim());
                }

                const token = localStorage.getItem('token');
                const url = `${API_BASE_URL}/transactions/export?${params.toString()}`;

                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Export failed');
                }

                // Get the blob from response
                const blob = await response.blob();

                // Create download link
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `transactions_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // Clean up
                window.URL.revokeObjectURL(downloadUrl);

                showToast('Export completed successfully!', 'success');
            } catch (error) {
                console.error('Export error:', error);
                showToast(error.message || 'Failed to export transactions', 'error');
            }
        }

        function renderPagination() {
            const container = document.getElementById('pagination-container');
            const paginationEl = document.getElementById('pagination');

            if (totalPages <= 1) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';

            let paginationHTML = '';

            // Previous button
            paginationHTML += `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}" ${currentPage === 1 ? 'tabindex="-1"' : ''}>
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
            `;

            // Page numbers
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);

            if (endPage - startPage + 1 < maxVisible) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            // First page
            if (startPage > 1) {
                paginationHTML += `
                    <li class="page-item">
                        <a class="page-link" href="#" data-page="1">1</a>
                    </li>
                    ${startPage > 2 ? '<li class="page-item disabled"><span class="page-link">...</span></li>' : ''}
                `;
            }

            // Page range
            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>
                `;
            }

            // Last page
            if (endPage < totalPages) {
                paginationHTML += `
                    ${endPage < totalPages - 1 ? '<li class="page-item disabled"><span class="page-link">...</span></li>' : ''}
                    <li class="page-item">
                        <a class="page-link" href="#" data-page="${totalPages}">${totalPages}</a>
                    </li>
                `;
            }

            // Next button
            paginationHTML += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'tabindex="-1"' : ''}>
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            `;

            paginationEl.innerHTML = paginationHTML;

            // Add event listeners
            paginationEl.querySelectorAll('.page-link').forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (this.parentElement.classList.contains('disabled')) return;

                    const page = parseInt(this.dataset.page);
                    if (page && page !== currentPage) {
                        loadTransactions(page);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            });
        }

        async function initiateRefund(transactionId) {

                if (!data || !data.success) {
                    showToast('Failed to load transaction details', 'error');
                    return;
                }

                const transaction = data.transaction;

                // Check if already refunded
                if (transaction.status === 'refunded' || transaction.status === 'partial_refund') {
                    showToast('Transaction already refunded', 'warning');
                    return;
                }

                if (transaction.status === 'cancelled') {
                    showToast('Cannot refund a cancelled transaction', 'warning');
                    return;
                }

                // Show refund dialog
                showRefundDialog(transaction);

            } catch (error) {
                console.error('Error initiating refund:', error);
                showToast('Error loading transaction details', 'error');
            }
        }

        async function processRefund(transactionId) {
            try {
                const reasonSelect = document.getElementById('refundReason');
                const otherReason = document.getElementById('otherReason');
                const notes = document.getElementById('refundNotes').value;

                let reason = reasonSelect.value;
                if (reason === 'other') {
                    reason = otherReason.value;
                }

                if (!reason) {
                    showToast('Please select a refund reason', 'error');
                    return;
                }

                const refundData = {
                    reason: reason
                };

                if (notes.trim()) {
                    refundData.notes = notes;
                }

                const response = await apiRequest(`/transactions/${transactionId}/refund`, {
                    method: 'POST',
                    body: JSON.stringify(refundData)
                });

                const modal = bootstrap.Modal.getInstance(document.getElementById('refundModal'));
                if (modal) {
                    modal.hide();
                }

                if (response && response.success) {
                    showToast(`Refund processed successfully!`, 'success');
                    loadTransactions(currentPage);
                } else {
                    showToast(response?.message || 'Failed to process refund', 'error');
                }

            } catch (error) {
                console.error('Error processing refund:', error);
                showToast('Error processing refund', 'error');
            }
        }

        function setupFilters() {
            // Set default dates (last 30 days)

            lastMonth.setDate(today.getDate() - 30);

            const dateFrom = document.getElementById('date-from');
            const dateTo = document.getElementById('date-to');

            if (dateFrom) dateFrom.valueAsDate = lastMonth;
            if (dateTo) dateTo.valueAsDate = today;

            // Apply filters button
            const applyBtn = document.getElementById('apply-filters');
            if (applyBtn) {
                applyBtn.addEventListener('click', () => {
                    console.log('Apply filters clicked');
                    loadTransactions(1);
                });
            }

            // Export button
            const exportBtn = document.getElementById('export-btn');
            if (exportBtn) {
                exportBtn.addEventListener('click', () => {
                    exportToCSV();
                });
            }

            // Single date sorting button
            const sortDateBtn = document.getElementById('sort-date-btn');
            if (sortDateBtn) {
                sortDateBtn.addEventListener('click', () => {
                    // Toggle sort order
                    if (currentSortOrder === 'desc') {
                        currentSortOrder = 'asc';
                        sortDateBtn.innerHTML = '<i class="bi bi-arrow-up"></i> Oldest First';
                        sortDateBtn.classList.add('sort-active');
                    } else {
                        currentSortOrder = 'desc';
                        sortDateBtn.innerHTML = '<i class="bi bi-arrow-down"></i> Newest First';
                        sortDateBtn.classList.add('sort-active');
                    }

                    // Reload transactions with new sort order
                    loadTransactions(1);
                });
            }

            // Search input with debounce
            const searchInput = document.getElementById('search-transaction');
            if (searchInput) {
                let debounceTimer;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        console.log('Searching for:', e.target.value);
                        loadTransactions(1);
                    }, 500); // Wait 500ms after user stops typing
                });

                // Also search on Enter key
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        clearTimeout(debounceTimer);
                        loadTransactions(1);
                    }
                });
            }

            // Auto-apply on filter changes
            document.querySelectorAll('#date-from, #date-to, #payment-method, #status-filter').forEach(input => {
                input.addEventListener('change', () => {
                    loadTransactions(1);
                });
            });
        }

                    if (data.business.address) businessSettings.address = data.business.address;
                    if (data.business.phone) businessSettings.phone = data.business.phone;
