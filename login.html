<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orion POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style_new.css">
    <style>
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
        }

     


        .overlay {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.60);
        }

        .left-side {
            position: relative;
            background: url('images/login-bg.jpg') no-repeat center center/cover;
            height: 100vh;
        }

        .login-card {
                        padding: 20px 40px; /* Reduced top/bottom padding */
            justify-content: flex-start; /* Align content to the top */
            overflow-y: auto; /* Allow scrolling for long forms */
            
            background-color: var(--bg-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
           
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .logo-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 75, 158, 0.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .remember-forgot a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-check input {
            width: auto;
            cursor: pointer;
        }

        .form-check label {
            margin: 0;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(91, 75, 158, 0.3);
        }

        .login-footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            background: var(--secondary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 20px;
            border-left: 3px solid var(--primary);
        }

        .demo-credentials strong {
            color: var(--text-primary);
        }

        .hero-container {
            position: absolute;
            top: 80%;
            color: var(--text-primary);
            text-align: left;
            padding: 20px;
            width: 70%;
        }

        .hero-container h1 {
            font-family: "Oswald", sans-serif;
            line-height: 0px;
            font-size: 128px;
            color: var(--primary);
            font-weight: 700;

        }

        .hero-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.2;
        }

    </style>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-lg-8 left-side p-0">
                <div class="container-fluid overlay">
                    <div class="hero-container">
                        <h1>“</h1>
                        <h2 class="hero-title">Turn your checkout into a growth engine. Get the tools to sell smarter
                            and manage effortlessly."</h2>

                    </div>
                </div>
            </div>
            <div class="col-lg-4 p-0">
                <div class="login-card">
                    <div class="login-header">
                        <div class="logo-icon"><i class="bi bi-lightning-fill"></i></div>
                        <div class="logo-text">Orion POS</div>
                        <div class="logo-subtitle">Modern Point of Sale System</div>
                    </div>

                    <form>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="your.email@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-container">
                                <input type="password" class="password" id="password" placeholder="••••••••" required>
                                <button type="button" class="toggle-password" id="togglePassword"
                                    aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="remember-forgot">
                            <div class="form-check">
                                <input type="checkbox" id="remember" checked>
                                <label for="remember">Remember me</label>
                            </div>
                            <a href="#">Forgot password?</a>
                        </div>

                        <button type="button" class="btn-login" id="login-btn">
                            Sign In
                        </button>
                    </form>

                    <div class="login-footer">
                        Don't have an account? <a href="signup.html">Create one</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script_new.js"></script>
</body>

</html>
